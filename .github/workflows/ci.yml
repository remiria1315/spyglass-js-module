name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM 22+
        shell: pwsh
        run: |
          $installed = (Get-Command clang-cl -ErrorAction SilentlyContinue)
          if ($installed -and [version]($installed.Version) -ge [version]"22.0") {
            Write-Host "clang-cl $($installed.Version) is already installed"
            exit 0
          }
          winget install --id LLVM.LLVM --version 22.1.0 --silent --accept-package-agreements --accept-source-agreements
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        shell: bash
        run: |
          clang-cl --version
          cmake --preset relwithdebinfo-windows
          cmake --build --preset relwithdebinfo-windows
          cmake --install build/relwithdebinfo-windows --prefix dist

      - uses: actions/upload-artifact@v4
        with:
          name: spyglass-windows
          path: dist/
