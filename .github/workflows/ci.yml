name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: lukka/get-cmake@latest

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Check the toolchain
        run: |
          clang-cl --version
          ninja --version

      - name: Configure
        run: cmake --preset relwithdebinfo-windows

      - name: Build
        run: cmake --build --preset relwithdebinfo-windows

      - name: Stage
        run: cmake --install build/relwithdebinfo-windows --prefix dist

      - uses: actions/upload-artifact@v4
        with:
          name: spyglass-windows
          path: dist/
